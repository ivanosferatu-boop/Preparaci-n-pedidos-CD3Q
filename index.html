<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión e Inventario CNT</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- SheetJS (XLSX) CDN para Importación/Exportación de Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Encabezado / Barra Superior -->
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-boxes-stacked text-2xl text-sky-400"></i>
            <h1 class="text-xl font-bold tracking-wide">Gestión de Logística e Inventario</h1>
        </div>
        <div>
            <!-- Indicador de Estado de Conexión -->
            <button id="cloudStatusBtn" onclick="toggleConfigModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-3 py-1.5 rounded-full text-sm transition flex items-center gap-2">
                <i class="fa-solid fa-database"></i>
                <span id="statusText">Conectando Cloud...</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Panel de Carga e Inventario -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 md:col-span-1 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">
                <i class="fa-solid fa-file-import text-sky-500 mr-2"></i>Carga de Inventario
            </h2>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Cargar Excel (.xlsx / .csv)</label>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100 cursor-pointer">
            </div>
            <button onclick="procesarExcel()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2 rounded-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-upload"></i> Procesar Archivo
            </button>
        </section>

        <!-- Panel de Validación y Despacho -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 md:col-span-2 flex flex-col gap-4">
            <h2 class="text-lg font-bold text-slate-700 border-b pb-2">
                <i class="fa-solid fa-barcode text-sky-500 mr-2"></i>Escaneo / Registro de Series
            </h2>
            <div class="flex gap-2">
                <input type="text" id="serieInput" placeholder="Ingrese o escanee Serie / ICCID / IMEI..." class="flex-1 border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500">
                <button onclick="registrarSerie()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Registrar
                </button>
            </div>

            <!-- Tabla de Registros -->
            <div class="overflow-x-auto mt-2">
                <table class="w-full text-sm text-left text-slate-600">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b">
                        <tr>
                            <th class="px-4 py-3">#</th>
                            <th class="px-4 py-3">Serie / Identificador</th>
                            <th class="px-4 py-3">Estado</th>
                            <th class="px-4 py-3">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tablaRegistros">
                        <tr>
                            <td colspan="4" class="text-center py-4 text-slate-400">No hay registros cargados aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal de Información de Conexión -->
    <div id="configModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 flex flex-col gap-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800">Estado de Firebase Cloud</h3>
                <button onclick="toggleConfigModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-sm text-slate-600">El sistema está vinculado al proyecto:</p>
            <div class="bg-slate-50 p-3 rounded-lg border text-xs font-mono text-slate-700">
                <p><strong>Project ID:</strong> preparacion-cd3q</p>
                <p><strong>Auth Domain:</strong> preparacion-cd3q.firebaseapp.com</p>
            </div>
            <button onclick="toggleConfigModal()" class="bg-sky-600 hover:bg-sky-700 text-white font-medium py-2 rounded-lg transition mt-2">
                Cerrar
            </button>
        </div>
    </div>

    <!-- Firebase SDK Modular (v10.8.0) -->
    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, onSnapshot, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración predeterminada de Firebase proporcionada
        const defaultFirebaseConfig = {
            apiKey: "AIzaSyBUYs6yfnAJ3IuDzd9u3K0F0T74dxLnl1Q",
            authDomain: "preparacion-cd3q.firebaseapp.com",
            projectId: "preparacion-cd3q",
            storageBucket: "preparacion-cd3q.firebasestorage.app",
            messagingSenderId: "669973043687",
            appId: "1:669973043687:web:8542cd541f414c2d718542"
        };

        // Estado Global
        window.dbState = {
            items: JSON.parse(localStorage.getItem('cnt_items') || '[]'),
            mode: 'local',
            db: null
        };

        // Inicialización de Firebase
        try {
            const app = getApps().length === 0 ? initializeApp(defaultFirebaseConfig) : getApps()[0];
            window.dbState.db = getFirestore(app);
            window.dbState.mode = 'cloud';

            // Escuchar cambios en tiempo real en la colección cnt_state/current_db
            onSnapshot(doc(window.dbState.db, "cnt_state", "current_db"), (docSnap) => {
                if (docSnap.exists()) {
                    window.dbState.items = docSnap.data().items || [];
                    localStorage.setItem('cnt_items', JSON.stringify(window.dbState.items));
                    window.renderTabla();
                }
            }, (error) => {
                console.warn("Error consultando Firestore, usando fallback local:", error);
                document.getElementById('statusText').innerText = 'Modo Local (Autónomo)';
            });

            document.getElementById('statusText').innerText = 'Cloud Sync Activo';
            document.getElementById('cloudStatusBtn').className = 'bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-3 py-1.5 rounded-full text-sm transition flex items-center gap-2';
        } catch (e) {
            console.error("Error al inicializar Firebase:", e);
            document.getElementById('statusText').innerText = 'Modo Local (Autónomo)';
        }

        // Renderizar tabla
        window.renderTabla = function() {
            const tbody = document.getElementById('tablaRegistros');
            if (window.dbState.items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-slate-400">No hay registros cargados aún.</td></tr>';
                return;
            }
            tbody.innerHTML = window.dbState.items.map((item, index) => `
                <tr class="border-b hover:bg-slate-50">
                    <td class="px-4 py-2.5">${index + 1}</td>
                    <td class="px-4 py-2.5 font-mono font-medium text-slate-800">${item.serie}</td>
                    <td class="px-4 py-2.5"><span class="bg-emerald-100 text-emerald-800 text-xs px-2 py-0.5 rounded-full">${item.estado}</span></td>
                    <td class="px-4 py-2.5 text-xs text-slate-500">${item.fecha}</td>
                </tr>
            `).join('');
        };

        // Registrar nueva serie
        window.registrarSerie = async function() {
            const input = document.getElementById('serieInput');
            const val = input.value.trim();
            if (!val) return;

            const nuevoRegistro = {
                serie: val,
                estado: 'Registrado',
                fecha: new Date().toLocaleString()
            };

            window.dbState.items.unshift(nuevoRegistro);
            input.value = '';

            await window.guardarEstado();
            window.renderTabla();
        };

        // Guardar estado (Local + Firestore)
        window.guardarEstado = async function() {
            localStorage.setItem('cnt_items', JSON.stringify(window.dbState.items));
            if (window.dbState.mode === 'cloud' && window.dbState.db) {
                try {
                    await setDoc(doc(window.dbState.db, "cnt_state", "current_db"), {
                        items: window.dbState.items,
                        updatedAt: new Date().toISOString()
                    });
                } catch (e) {
                    console.error("Error al sincronizar con Firestore:", e);
                }
            }
        };

        // Procesar Excel localmente
        window.procesarExcel = function() {
            const fileInput = document.getElementById('excelFileInput');
            if (!fileInput.files.length) return alert('Por favor seleccione un archivo Excel.');

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                const seriesProcesadas = jsonData.flat().filter(cell => cell).map(cell => ({
                    serie: String(cell).trim(),
                    estado: 'Cargado de Excel',
                    fecha: new Date().toLocaleString()
                }));

                window.dbState.items = [...seriesProcesadas, ...window.dbState.items];
                window.guardarEstado();
                window.renderTabla();
                fileInput.value = '';
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        };

        // Control del Modal
        window.toggleConfigModal = function() {
            const modal = document.getElementById('configModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        };

        // Carga inicial de datos
        window.renderTabla();
    </script>
</body>
</html>
