<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carga Masiva de Inventario y Pedidos</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 font-sans">

  <div class="max-w-6xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    
    <!-- Encabezado de la Sección -->
    <div class="flex items-center space-x-3 mb-6">
      <div class="p-2 bg-blue-600/20 rounded-lg text-blue-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
        </svg>
      </div>
      <h2 class="text-xl font-bold text-white tracking-wide">Carga Masiva desde Archivo Excel / CSV</h2>
    </div>

    <!-- Pestañas de Selección de Categoría (6 Opciones) -->
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6">
      
      <!-- 1. Equipos -->
      <button type="button" onclick="selectUploadType('equipos')" id="btn-equipos" 
        class="upload-tab-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-700/50 transition-all cursor-pointer">
        <span class="text-sm font-semibold mb-1 flex items-center gap-1.5">📱 Equipos</span>
        <span class="text-[11px] text-slate-400">Series / IMEI</span>
      </button>

      <!-- 2. SIM Cards -->
      <button type="button" onclick="selectUploadType('sim')" id="btn-sim" 
        class="upload-tab-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-700/50 transition-all cursor-pointer">
        <span class="text-sm font-semibold mb-1 flex items-center gap-1.5">💳 SIM Cards</span>
        <span class="text-[11px] text-slate-400">ICCID</span>
      </button>

      <!-- 3. eSIMs -->
      <button type="button" onclick="selectUploadType('esim')" id="btn-esim" 
        class="upload-tab-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-700/50 transition-all cursor-pointer">
        <span class="text-sm font-semibold mb-1 flex items-center gap-1.5">🌐 eSIMs</span>
        <span class="text-[11px] text-slate-400">Códigos QR</span>
      </button>

      <!-- 4. Publicidad -->
      <button type="button" onclick="selectUploadType('publicidad')" id="btn-publicidad" 
        class="upload-tab-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-700/50 transition-all cursor-pointer">
        <span class="text-sm font-semibold mb-1 flex items-center gap-1.5">📣 Publicidad</span>
        <span class="text-[11px] text-slate-400">Packs / Material</span>
      </button>

      <!-- 5. POP -->
      <button type="button" onclick="selectUploadType('pop')" id="btn-pop" 
        class="upload-tab-btn flex flex-col items-center justify-center p-3 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-700/50 transition-all cursor-pointer">
        <span class="text-sm font-semibold mb-1 flex items-center gap-1.5">🎯 POP</span>
        <span class="text-[11px] text-slate-400">Material POP</span>
      </button>

      <!-- 6. Pedidos (Nuevo) -->
      <button type="button" onclick="selectUploadType('pedidos')" id="btn-pedidos" 
        class="upload-tab-btn flex flex-col items-center justify-center p-3 rounded-xl border border-blue-500 bg-blue-500/10 transition-all cursor-pointer">
        <span class="text-sm font-semibold mb-1 flex items-center gap-1.5 text-blue-400">📦 Pedidos</span>
        <span class="text-[11px] text-slate-400">Pre-carga Órdenes</span>
      </button>

    </div>

    <!-- Zona Drag & Drop / Input File -->
    <div id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-blue-500/50 rounded-2xl p-10 text-center bg-slate-950/40 transition-colors cursor-pointer relative">
      <input type="file" id="file-input" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleFileSelect(event)">
      
      <label for="file-input" class="cursor-pointer flex flex-col items-center justify-center">
        <div class="p-4 bg-slate-800/80 rounded-full mb-4 text-blue-400 border border-slate-700">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
          </svg>
        </div>
        <p class="text-slate-200 font-semibold text-base mb-1">Arrastre su archivo Excel (.xlsx) o CSV aquí</p>
        <p class="text-xs text-slate-500 mb-3">o haga clic para explorar en su equipo</p>
        
        <p id="upload-hint" class="text-xs text-blue-400/90 font-medium bg-blue-500/10 px-3 py-1.5 rounded-md border border-blue-500/20">
          Soporta columnas: Pedido SAP, Fecha Emisión, Punto Venta / Bodega Destino, Estado
        </p>
      </label>
    </div>

  </div>

  <!-- Script de Control -->
  <script>
    // Tipo de carga por defecto
    let currentUploadType = 'pedidos';

    // Diccionario de especificaciones de columnas requeridas por tipo
    const uploadConfigs = {
      equipos: {
        hint: "Soporta columnas: Pedido SAP, Descripción Bodega, Serie / IMEI, TIPO DEL LOTE"
      },
      sim: {
        hint: "Soporta columnas: Pedido SAP, ICCID, Rango Inicial, Rango Final, Cantidad"
      },
      esim: {
        hint: "Soporta columnas: Pedido SAP, Código QR, Pin/Puk, Serial eSIM"
      },
      publicidad: {
        hint: "Soporta columnas: Pedido SAP, Código Material, Descripción, Cantidad Pack"
      },
      pop: {
        hint: "Soporta columnas: Pedido SAP, Tipo Material POP, Cantidad, Destino"
      },
      pedidos: {
        hint: "Soporta columnas: Pedido SAP, Fecha Emisión, Punto Venta / Bodega Destino, Estado"
      }
    };

    // Función para cambiar entre categorías
    function selectUploadType(type) {
      currentUploadType = type;

      // 1. Desmarcar todos los botones
      document.querySelectorAll('.upload-tab-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'bg-blue-500/10');
        btn.classList.add('border-slate-700', 'bg-slate-800/50');
        
        const titleSpan = btn.querySelector('span:first-child');
        if (titleSpan) titleSpan.classList.remove('text-blue-400');
      });

      // 2. Marcar botón activo
      const activeBtn = document.getElementById(`btn-${type}`);
      if (activeBtn) {
        activeBtn.classList.remove('border-slate-700', 'bg-slate-800/50');
        activeBtn.classList.add('border-blue-500', 'bg-blue-500/10');
        
        const titleSpan = activeBtn.querySelector('span:first-child');
        if (titleSpan) titleSpan.classList.add('text-blue-400');
      }

      // 3. Actualizar dinámicamente las columnas sugeridas
      const hintElement = document.getElementById('upload-hint');
      if (hintElement && uploadConfigs[type]) {
        hintElement.textContent = uploadConfigs[type].hint;
      }
    }

    // Manejador del archivo seleccionado
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        alert(`Archivo "${file.name}" cargado correctamente para la categoría: ${currentUploadType.toUpperCase()}`);
      }
    }
  </script>

</body>
</html>
